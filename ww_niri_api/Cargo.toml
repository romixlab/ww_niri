[package]
name = "ww_niri_api"
version = "0.1.0"
description = "WireWeaver control API of ww_niri: windows, outputs, apps, browsers, media players and audio"
authors = ["Roman Isaikin <roman@vhrd.tech>"]
license = "GPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/romixlab/ww_niri"

# Wire version of the API: link setup decides on its line
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_si/std"]

[dependencies]
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["time", "dimensionless", "u16", "u32", "u64", "i64"] }
