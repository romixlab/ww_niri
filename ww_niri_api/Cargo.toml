[package]
name = "ww_niri_api"
version = "0.1.0"
description = "WireWeaver control API of ww_niri: windows, outputs, apps, browsers, media players and audio"
authors = ["Roman Isaikin <roman@vhrd.tech>"]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/romixlab/ww_niri"

# Wire version of the API: link setup decides on its line
[package.metadata.wire_weaver]
wire = "w1.0"

# ww_keyed: named by the code `mounts!(ext)` generates in the API's users
[package.metadata.cargo-machete]
ignored = ["ww_keyed"]

[features]
default = ["std"]
std = ["ww_api/std", "ww_keyed/std", "ww_si/std"]

[dependencies]
ww_api.workspace = true
ww_keyed.workspace = true
ww_si = { workspace = true, features = ["time", "dimensionless", "u16", "u32", "u64", "i64"] }
