[package]
name = "ww_niri_client"
version = "0.1.0"
description = "Client of ww_niri's control API: a TV handle with a live model, typed commands and coalescing"
authors = ["Roman Isaikin <roman@vhrd.tech>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version.workspace = true
repository = "https://github.com/romixlab/ww_niri"
publish = false

[dependencies]
exact_units = { workspace = true, features = [
  "std",
  "shrink_wrap",
  "time",
  "dimensionless",
] }
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
wire_weaver = { workspace = true, features = ["std"] }
# ws: the TV over WebSocket; in_process: ww_niri_fake in tests and demo modes
wire_weaver_client = { workspace = true, features = ["ws", "in_process"] }
ww_niri_api.workspace = true

[dev-dependencies]
ww_niri_fake.workspace = true
